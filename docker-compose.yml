# ==============================================================================
# WRITELYNX HARDENED PRODUCTION DOCKER COMPOSE TOPOLOGY
# Services:
# 1. postgres: ACID-compliant PostgreSQL 16 database with row-level locks
# 2. backend: FastAPI Uvicorn API runtime (non-root)
# 3. worker: Isolated durable job queue worker daemon
# 4. caddy: Reverse proxy with automatic TLS, rate limits, and static SPA serving
# ==============================================================================

version: "3.8"

networks:
  writelynx_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: writelynx_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: writelynx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-writelynx_secure_pass}
      POSTGRES_DB: writelynx_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - writelynx_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writelynx -d writelynx_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: writelynx_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - STORAGE_DIR=/app/storage
      - DATABASE_URL=postgresql://writelynx:${POSTGRES_PASSWORD:-writelynx_secure_pass}@postgres:5432/writelynx_db
    volumes:
      - ./storage:/app/storage
    networks:
      - writelynx_net
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: writelynx_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - STORAGE_DIR=/app/storage
      - DATABASE_URL=postgresql://writelynx:${POSTGRES_PASSWORD:-writelynx_secure_pass}@postgres:5432/writelynx_db
    volumes:
      - ./storage:/app/storage
    networks:
      - writelynx_net
    command: ["python", "-m", "backend.app.workers.durable_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    container_name: writelynx_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/var/www/writelynx:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - writelynx_net
    depends_on:
      - backend
